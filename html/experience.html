<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolillofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/experience.css">
</head>
<body>
    <div id="scene">
        <img id="inicio" src="../media/experience/fp (3).png">
        
        <a id="exit" href="./menu.html">
            <img class="exit_button" src="../media/main/close.png">
        </a>

        <div class="carousel-wrapper">
            <img src="../media/experience/left_btn.png" id="prev_btn" class="nav prev">

            <img src="../media/experience/car_1.png" id="carousel">

            <div class="carousel-track">
                <img id="prev_inactive" src="../media/experience/canis.png" class="carousel-item">
                <img id="active" src="../media/experience/coralia.png">
                <img id="next_inactive" src="../media/experience/cuento.png" class="carousel-item">
                <img id="hidden" src="../media/experience/personajes.png">
            </div>

            <img src="../media/experience/right_btn.png" id="next_btn" class="nav next">
        </div>


        <!-- Overlay + popup, hidden by default -->
        <div id="popup_overlay" class="overlay">
            <div id="popup" class="popup">
                <div class="popup_content">
                    <button class="popup_close">
                        <img id="popup_exit" class="exit_button" src="../media/main/close.png">
                    </button>
                </div>
            </div>
        </div>

    </div>
</body>
<script src="../js/experience_behavior.js"></script>
</html>
